syntax = "proto3";

package library.v1;

import "google/protobuf/timestamp.proto";

enum Genre {
  GENRE_UNSPECIFIED = 0;
  FICTION = 1;
  SCIENCE = 2;
}

message Book {
  string id = 1;
  string title = 2;
  string author = 3;
  int32 year = 4;
  repeated string tags = 5;
  Genre genre = 6;
  google.protobuf.Timestamp published_at = 7;
}

message GetBookRequest {
  string id = 1;
}

message ListBooksRequest {
  string author = 1;
}

message AddBooksReply {
  int32 added = 1;
  string last_title = 2;
}

service BookService {
  rpc GetBook(GetBookRequest) returns (Book);
  rpc ListBooks(ListBooksRequest) returns (stream Book);
  rpc AddBooks(stream Book) returns (AddBooksReply);
}
