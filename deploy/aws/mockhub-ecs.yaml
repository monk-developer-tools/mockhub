AWSTemplateFormatVersion: '2010-09-09'
Description: MockHub on ECS Fargate with EFS persistence behind an Application Load Balancer.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.
  LoadBalancerSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs for the load balancer (public for internet-facing, private for internal).
  ServiceSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the MockHub task and the EFS mount targets (one per AZ). They need a NAT or VPC endpoints to pull the image.
  LoadBalancerScheme:
    Type: String
    AllowedValues: [internal, internet-facing]
    Default: internal
    Description: Use internal for test environments reachable only inside your network.
  AllowedCidr:
    Type: String
    Default: 10.0.0.0/8
    Description: CIDR allowed to reach the load balancer.
  Image:
    Type: String
    Default: abhaypratap/mockhub:latest
    Description: Container image to run.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for HTTPS. Leave empty for HTTP only.
  PublicUrl:
    Type: String
    Default: ''
    Description: Public URL of MockHub, e.g. https://mocks.example.com. Used in Postman/Bruno exports. Defaults to the request host.
  UsersSecretArn:
    Type: String
    Default: ''
    Description: ARN of a Secrets Manager secret whose plain-text value is MOCKHUB_USERS (user:password:role,...). Leave empty to disable sign-in.
  Cpu:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048, 4096]
  Memory:
    Type: Number
    Default: 1024
    AllowedValues: [512, 1024, 2048, 3072, 4096, 8192]

Conditions:
  UseHttps: !Not [!Equals [!Ref CertificateArn, '']]
  UseUsers: !Not [!Equals [!Ref UsersSecretArn, '']]
  UsePublicUrl: !Not [!Equals [!Ref PublicUrl, '']]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MockHub load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MockHub task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  FileSystemSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MockHub EFS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      BackupPolicy:
        Status: ENABLED
      FileSystemTags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-data

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [0, !Ref ServiceSubnets]
      SecurityGroups: [!Ref FileSystemSecurityGroup]

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Select [1, !Ref ServiceSubnets]
      SecurityGroups: [!Ref FileSystemSecurityGroup]

  AccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      PosixUser:
        Uid: '65532'
        Gid: '65532'
      RootDirectory:
        Path: /mockhub
        CreationInfo:
          OwnerUid: '65532'
          OwnerGid: '65532'
          Permissions: '0750'

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - !If
          - UseUsers
          - PolicyName: read-users-secret
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref UsersSecretArn
          - !Ref AWS::NoValue

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: efs-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                Resource: !GetAtt FileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !GetAtt AccessPoint.Arn

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref AccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: mockhub
          Image: !Ref Image
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
          Environment:
            - Name: MOCKHUB_DATA_DIR
              Value: /data
            - !If
              - UsePublicUrl
              - Name: MOCKHUB_PUBLIC_URL
                Value: !Ref PublicUrl
              - !Ref AWS::NoValue
          Secrets:
            - !If
              - UseUsers
              - Name: MOCKHUB_USERS
                ValueFrom: !Ref UsersSecretArn
              - !Ref AWS::NoValue
          HealthCheck:
            Command: ['CMD', '/opt/java/bin/java', '-XX:TieredStopAtLevel=1', '-cp', '/opt/mockhub/mockhub.jar', 'io.mockhub.HealthCheck']
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mockhub

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: !Ref LoadBalancerScheme
      Subnets: !Ref LoadBalancerSubnets
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '120'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /__admin/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '10'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - UseHttps
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseHttps
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, MountTargetA, MountTargetB]
    Properties:
      ServiceName: mockhub
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      EnableExecuteCommand: false
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref ServiceSubnets
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: mockhub
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  Url:
    Description: MockHub URL (point a DNS record at the load balancer for a friendly name).
    Value: !Sub
      - ${Scheme}://${LoadBalancer.DNSName}/__admin/mockhub/ui/
      - Scheme: !If [UseHttps, https, http]
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  FileSystemId:
    Description: EFS file system holding projects and stubs (retained when the stack is deleted).
    Value: !Ref FileSystem
