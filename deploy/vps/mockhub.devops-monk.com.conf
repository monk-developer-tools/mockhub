# mockhub.devops-monk.com → MockHub website (static) + live demo (container on 127.0.0.1:8095).
# Only this file belongs to MockHub; `certbot --nginx` adds the 443 block and redirect here.
# Webhook bins get their own, higher rate; MockHub limits each sender to 1,200 a minute itself.
limit_req_zone $binary_remote_addr zone=mockhub_bins:10m rate=1200r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mockhub.devops-monk.com;

    root /var/www/mockhub;
    index index.html;

    access_log /var/log/nginx/mockhub.access.log;
    error_log  /var/log/nginx/mockhub.error.log;

    # Zones `perip`, `general` and `api` are defined server-wide in conf.d/rate-limit.conf.
    limit_conn perip 30;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain text/xml;

    client_max_body_size 10m;

    location = / {
        limit_req zone=general burst=60 nodelay;
        try_files /index.html =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location /assets/ {
        limit_req zone=general burst=120 nodelay;
        expires 7d;
        try_files $uri =404;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/index.html =404;
    }

    location = /tutorials {
        return 301 /tutorials/;
    }

    location /tutorials/ {
        limit_req zone=general burst=60 nodelay;
        try_files $uri $uri/index.html =404;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
    }

    # Feature pages are folders with an index.html; any other path is the MockHub demo:
    # UI and API under /__admin, mocks under each project's base path.
    location ~ ^/__public/(bins|inspect)/ {
        limit_req zone=mockhub_bins burst=200 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri/index.html @demo;
    }

    location @demo {
        limit_req zone=api burst=80 nodelay;
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
