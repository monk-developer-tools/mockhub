name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: abhaypratap/mockhub

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit, integration, system and UI tests
        run: ./gradlew build -PwithUi --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mockhub-jar
          path: build/libs/mockhub.jar

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  docker:
    name: Publish Docker image
    needs: [test, terraform]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: mockhub:smoke
          cache-from: type=gha

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8080:8080 mockhub:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/__admin/mockhub/api/auth/info > /dev/null; then
              curl -fsS -X POST http://localhost:8080/__admin/mockhub/api/examples/rest-basics/install > /dev/null
              curl -fsS http://localhost:8080/example-petstore/pets/42
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MockHub
            org.opencontainers.image.url=https://mockhub.devops-monk.com
            org.opencontainers.image.documentation=https://mockhub.devops-monk.com/docs/
            org.opencontainers.image.vendor=monk-developer-tools

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update Docker Hub description
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Team mock server for REST and SOAP on WireMock: web UI, AI assistant, teams, Postman/Bruno export"
          readme-filepath: ./deploy/dockerhub/README.md

      - name: Remove old image tags
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: deploy/dockerhub-prune.sh --keep 2 --yes
